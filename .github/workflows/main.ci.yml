name: Main / CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate-branch-name:
    name: validate-branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name format
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "Checking branch name: $BRANCH"

          # Must be <prefix>/<name>, with both parts in lowercase kebab-case
          if [[ ! "$BRANCH" =~ ^[a-z0-9]+(-[a-z0-9]+)*/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Branch name must be <prefix>/<name> in lowercase kebab-case (e.g., feature/my-new-feature)"
            exit 1
          fi

          echo "Branch name is valid."

  check-formatting:
    name: check-formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Check formatting
        run: bun run format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

  build-binary:
    name: build-binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun build Source/Cli.ts --compile --outfile Build/bloxgen

      - name: Verify binary runs
        run: ./Build/bloxgen version

  check-version-match:
    name: check-version-match
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check VERSION matches package.json
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")

          if [ "$FILE_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::VERSION file ($FILE_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

          echo "Versions match: $FILE_VERSION"
